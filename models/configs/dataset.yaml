# YOLO Dataset Configuration
# Product Detection - 4 Classes (Roboflow Dataset)

# Dataset paths (relative to this yaml file location)
path: ../../data/splits          # dataset root dir
train: train/images              # train images (70%)
val: val/images                  # val images (20%)
test: test/images                # test images (10%)

# Number of classes
nc: 4

# Class names - Roboflow-оос авсан 4 ангилал
# ЧУХАЛ: Roboflow дээрх дарааллыг яг дагана!
names:
  0: bonaqua_500ml
  1: coca_cola_500ml
  2: fanta_500ml
  3: sprite_500ml

# Dataset statistics:
# - Нийт зураг: 96
# - Train: 67 (70%)
# - Val: 19 (20%)
# - Test: 10 (10%)
